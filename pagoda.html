<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Pagoda Garden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  body {
    background: linear-gradient(180deg, #aee3ff 0%, #cdeedd 55%, #fdf3c9 100%);
  }
  canvas { display:block; }
  #vignette {
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(60,70,90,0.18) 100%);
  }
  #title {
    position:fixed; top:22px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
    color:#3b4a5a;
  }
  #title h1 {
    font-size:30px; letter-spacing:4px; font-weight:700;
    text-shadow: 0 2px 0 rgba(255,255,255,.65);
  }
  #title p { font-size:12px; letter-spacing:2px; opacity:.7; margin-top:2px; }
  #hint {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.55); backdrop-filter:blur(6px);
    padding:8px 16px; border-radius:20px; font-size:12px; color:#4a5a6a;
    letter-spacing:1px; box-shadow:0 2px 10px rgba(0,0,0,.08);
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title"><h1>PAGODA GARDEN</h1><p>a little voxel paradise</p></div>
<div id="hint">drag to rotate &nbsp;•&nbsp; scroll to zoom &nbsp;•&nbsp; right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- seeded random so the garden is consistent ----------
let seed = 7;
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rint(a,b){ return a + Math.floor(rnd()*(b-a+1)); }

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f0, 55, 110);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(26, 22, 30);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, -4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 12; controls.maxDistance = 60;
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x7bbf62, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.14));

const sun = new THREE.DirectionalLight(0xfff1d6, 0.90);
sun.position.set(22, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;  sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0012;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// ---------- voxel helper (deduplicated by coordinate to prevent Z-fighting) ----------
const voxelMap = new Map();
function vx(x,y,z,c){
  const rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  voxelMap.set(rx + ',' + ry + ',' + rz, {x:rx, y:ry, z:rz, c:new THREE.Color(c)});
}
function box(x0,y0,z0,w,h,d,c,jitter){
  jitter = (jitter===undefined)?0.06:jitter;
  for(let i=0;i<w;i++)for(let j=0;j<h;j++)for(let k=0;k<d;k++){
    const col = new THREE.Color(c);
    col.offsetHSL((rnd()-0.5)*0.02, 0, (rnd()-0.5)*jitter);
    vx(x0+i,y0+j,z0+k,col);
  }
}
function cyl(cx,cy,cz,r,c,jitter){ // cheap round-ish blob
  for(let x=-r;x<=r;x++)for(let y=-r;y<=r;y++)for(let z=-r;z<=r;z++){
    const d = Math.sqrt(x*x+y*y+z*z);
    if(d <= r + 0.45){
      const col = new THREE.Color(c);
      col.offsetHSL(0,0,(rnd()-0.5)*(jitter||0.07));
      vx(cx+x,cy+y,cz+z,col);
    }
  }
}

// ---------- ground ----------
const GROUND = 22; // half-size
box(-GROUND,-2,-GROUND, GROUND*2, 2, GROUND*2, 0x8a5f3c, 0.06); // dirt sides
const grassColors = [0x6cc24f, 0x63b64a, 0x78cc58, 0x5db34a, 0x6fca52];
for(let x=-GROUND;x<GROUND;x++)for(let z=-GROUND;z<GROUND;z++){
  const ax = Math.abs(x), az = Math.abs(z);
  if(ax>19 && az>19 && rnd()<0.55) continue; // rounded corners
  const c = grassColors[Math.floor(rnd()*grassColors.length)];
  const col = new THREE.Color(c); col.offsetHSL(0,0,(rnd()-0.5)*0.05);
  vx(x,0,z,col);
}
// subtle dirt patches on grass
for(let i=0;i<14;i++){
  const x = rint(-18,18), z = rint(-18,18);
  vx(x,0,z, 0x8aa45a);
}

// ---------- path ----------
const sandCols = [0xe8d3a0, 0xdfc693, 0xead7ab, 0xd8c08e];
for(let z=1; z<20; z++){
  const cxPath = Math.round(Math.sin(z*0.4)*1.6);
  for(let dx=-1; dx<=1; dx++){
    if(Math.abs(dx)===1 && rnd()<0.3) continue;
    const x = cxPath + dx;
    if(rnd()<0.9) vx(x,0,z, sandCols[Math.floor(rnd()*sandCols.length)]);
  }
}

// ---------- pond ----------
const pondX = 12, pondZ = 9;
for(let x=-5;x<=5;x++)for(let z=-4;z<=4;z++){
  const d = Math.sqrt((x*x)/(25) + (z*z)/(16));
  if(d<1 && rnd()<0.92){
    const col = new THREE.Color(0x4fb3e0); col.offsetHSL(0,0,(rnd()-0.5)*0.12);
    vx(pondX+x,0,pondZ+z,col);
  }
}
// lily pads
vx(pondX-2,0,pondZ-1, 0x3fa06a); vx(pondX-2,1,pondZ-1, 0x3fa06a);
vx(pondX+2,0,pondZ+2, 0x3fa06a);
vx(pondX-2,1,pondZ-1, 0xffb3c8); // tiny lily blossom

// ---------- pagoda ----------
const pcx = 0, pcz = -6;
// base platform
box(pcx-4,1,pcz-4, 8,1,8, 0xb9b2a6, 0.05);
box(pcx-1,1,pcz+4, 3,1,1, 0xcfc8bb, 0.05); // front step

// helpers
function roof(cx,cz,y,size,roofColor,trimColor){
  // wide thin eave, main slab, cap
  box(cx-(size+2)/2+0.5|0, y, cz-(size+2)/2+0.5|0, size+2, 1, size+2, trimColor, 0.05);
  box(cx-size/2+0.5|0, y+1, cz-size/2+0.5|0, size, 1, size, roofColor, 0.05);
  box(cx-(size-2)/2+0.5|0, y+2, cz-(size-2)/2+0.5|0, size-2, 1, size-2, roofColor, 0.05);
}
function columns(cx,cz,y,size,inset,colColor){
  const off = size/2 - inset;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    vx(Math.round(cx+sx*off),y,Math.round(cz+sz*off),colColor);
    vx(Math.round(cx+sx*off),y+1,Math.round(cz+sz*off),colColor);
    vx(Math.round(cx+sx*off),y+2,Math.round(cz+sz*off),colColor);
    vx(Math.round(cx+sx*off),y+3,Math.round(cz+sz*off),colColor);
  });
}
const ROOF = 0x3d6b5e, TRIM = 0x2c4f45, GOLD = 0xf2c14e;
// Tier 1
columns(pcx,pcz,2,8,2, 0x9c6b4a);
roof(pcx,pcz,6,8,ROOF,TRIM);
// Tier 2
columns(pcx,pcz,9,6,1.7, 0x9c6b4a);
roof(pcx,pcz,13,6,ROOF,TRIM);
// Tier 3
columns(pcx,pcz,16,4,1.4, 0x9c6b4a);
roof(pcx,pcz,20,4,ROOF,TRIM);
// golden finial
vx(pcx,23,pcz,GOLD);
vx(pcx,24,pcz,GOLD);
vx(pcx-1,24,pcz,GOLD); vx(pcx+1,24,pcz,GOLD); vx(pcx,24,pcz-1,GOLD); vx(pcx,24,pcz+1,GOLD);
vx(pcx,25,pcz,0xffe28a);
vx(pcx,26,pcz,0xffe28a);

// tiny roof lanterns (gold corners)
[[-4,-4],[4,-4],[-4,4],[4,4]].forEach(([dx,dz])=>{
  vx(pcx+dx,7,pcz+dz,GOLD);
});

// ---------- trees ----------
function trunk(x,z,h,color){
  for(let i=0;i<h;i++) vx(x,i+1,z, i%2? color : new THREE.Color(color).offsetHSL(0,0,0.08).getHex());
}
function cherryTree(x,z,big){
  const h = big?3:2;
  trunk(x,z,h, 0x6b4a34);
  const r = big?4:3;
  for(let dx=-r;dx<=r;dx++)for(let dy=0;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
    const d = Math.sqrt(dx*dx+dz*dz) + Math.abs(dy-2)*0.4;
    if(d <= r+0.3 && Math.abs(dy-2)<r){
      const col = new THREE.Color([0xf7b8cf,0xf5a9c4,0xfde3ec,0xef8fb0][Math.floor(rnd()*4)]);
      col.offsetHSL(0,0,(rnd()-0.5)*0.06);
      vx(x+dx, h+2+dy, z+dz, col);
    }
  }
}
function roundTree(x,z,big){
  trunk(x,z,3,0x7a5238);
  const r = big?4:3;
  for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
    const d = Math.sqrt(dx*dx+dz*dz);
    if(d <= r+0.4){
      const col = new THREE.Color([0x4fa53f,0x5fb34a,0x74c058,0x3f8f36][Math.floor(rnd()*4)]);
      col.offsetHSL(0,0,(rnd()-0.5)*0.07);
      vx(x+dx, 5+Math.round(rnd()*2), z+dz, col);
      vx(x+dx, 4+Math.round(rnd()*1), z+dz, col);
    }
  }
}
function pineTree(x,z){
  trunk(x,z,2,0x6b4a34);
  for(let layer=0; layer<3; layer++){
    const s = 4 - layer;
    for(let dx=-s;dx<=s;dx++)for(let dz=-s;dz<=s;dz++){
      const d = Math.max(Math.abs(dx),Math.abs(dz));
      if(d <= s){
        const col = new THREE.Color([0x2f7d3f,0x359046,0x3fa24e][Math.floor(rnd()*3)]);
        col.offsetHSL(0,0,(rnd()-0.5)*0.06);
        vx(x+dx, 3+layer*2, z+dz, col);
      }
    }
  }
  vx(x,9,z,0x2f7d3f);
}

cherryTree(-11,-4,true);
cherryTree(9,-3,true);
cherryTree(-6,7,false);
roundTree(-12,4,true);
roundTree(13,-8,false);
pineTree(-3,-11);
pineTree(7,-10);

// ---------- bushes ----------
[[-8,-8],[12,2],[-14,-6],[4,10],[-4,12]].forEach(([x,z])=>{
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    if(Math.abs(dx)===1 && Math.abs(dz)===1 && rnd()<0.4) continue;
    const col = new THREE.Color([0x58b548,0x4aa63e,0x6ac45c][Math.floor(rnd()*3)]);
    vx(x+dx, 1, z+dz, col);
    if(rnd()<0.35) vx(x+dx, 2, z+dz, col);
  }
});

// ---------- flowers ----------
const flowerCols = [0xff5d73, 0xffd166, 0xfff6f0, 0xb58cff, 0xff9046];
for(let i=0;i<40;i++){
  const x = rint(-17,17), z = rint(-17,17);
  const dx = Math.abs(x), dz = Math.abs(z);
  if(dx>16 && dz>16) continue;
  // keep path clear-ish
  const c = flowerCols[Math.floor(rnd()*flowerCols.length)];
  vx(x,0,z, new THREE.Color(c).offsetHSL(0,0,-0.12).getHex()); // tiny  stem-ish
  vx(x,1,z, c);
}

// ---------- garden lanterns ----------
function lantern(x,z){
  box(x,0,z, 1,1,1, 0x9a938a, 0.05);
  box(x-0.0,1,z, 1,1,1, 0xcfc7ba, 0.05);
  vx(x,2,z, 0xffe28a); // glow
  vx(x,3,z, 0x9a938a);
}
lantern(-6,1); lantern(7,1); lantern(-2,15);

// ---------- rocks ----------
[[-15,10],[16,7],[-9,-13],[11,-6]].forEach(([x,z])=>{
  const s = rint(1,2);
  cyl(x,1,z,s-0.5, 0xa7a19a, 0.1);
});

// ---------- build the instanced mesh ----------
const voxelList = Array.from(voxelMap.values());
const geo = new THREE.BoxGeometry(1,1,1);
const mat = new THREE.MeshLambertMaterial({ color:0xffffff });
const voxelMesh = new THREE.InstancedMesh(geo, mat, voxelList.length);
const dummy = new THREE.Object3D();
voxelList.forEach((v,i)=>{
  dummy.position.set(v.x+0.5, v.y+0.5, v.z+0.5);
  dummy.updateMatrix();
  voxelMesh.setMatrixAt(i,dummy.matrix);
  voxelMesh.setColorAt(i, v.c);
});
voxelMesh.instanceMatrix.needsUpdate = true;
if(voxelMesh.instanceColor) voxelMesh.instanceColor.needsUpdate = true;
voxelMesh.castShadow = true;
voxelMesh.receiveShadow = true;
scene.add(voxelMesh);

// ---------- clouds ----------
const clouds = [];
function makeCloud(x,y,z,s){
  const g = new THREE.Group();
  const cols = [0xffffff, 0xf6faff, 0xeef4fb];
  for(let i=0;i<5;i++){
    const w = rint(3,5)*s, d = rint(2,3)*s;
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, 1.2, d),
      new THREE.MeshLambertMaterial({color:cols[Math.floor(rnd()*cols.length)]})
    );
    m.position.set((rnd()-0.5)*4*s, (rnd()-0.5)*1.2, (rnd()-0.5)*2.5*s);
    m.castShadow = true;
    g.add(m);
  }
  g.position.set(x,y,z);
  scene.add(g); clouds.push(g);
}
makeCloud(-18,20,-16,1.2); makeCloud(16,23,-8,1.0); makeCloud(2,25,-20,0.9);

// ---------- floating birds ----------
const birds = [];
function makeBird(x,y,z){
  const b = new THREE.Group();
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.25,0.5), new THREE.MeshLambertMaterial({color:0xffffff}));
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.2,0.45), new THREE.MeshLambertMaterial({color:0x2f3a45}));
  const wingR = wingL.clone();
  wing.position.y = 0; wingL.position.set(-0.85,0,0); wingR.position.set(0.85,0,0);
  b.add(wing); b.add(wingL); b.add(wingR);
  b.position.set(x,y,z);
  scene.add(b); birds.push({g:b, wingL, wingR, phase:rnd()*10, speed:1+rnd()*0.5});
}
makeBird(-8,16,4); makeBird(6,19,6); makeBird(14,17,-2);

// ---------- falling petals ----------
const petals = [];
const petalGeo = new THREE.BoxGeometry(0.35,0.08,0.28);
const petalCols = [0xf7b8cf, 0xf5a9c4, 0xfde3ec, 0xef8fb0];
for(let i=0;i<45;i++){
  const tree = [[-11,-4],[9,-3],[-6,7]][Math.floor(rnd()*3)];
  const m = new THREE.Mesh(petalGeo, new THREE.MeshLambertMaterial({color:petalCols[Math.floor(rnd()*petalCols.length)]}));
  resetPetal(m, tree);
  scene.add(m); petals.push({m, t:rnd()*10, speed:0.6+rnd()*0.7, tree, sway:rnd()*10});
}
function resetPetal(m, tree){
  const dx = (rnd()-0.5)*6, dz = (rnd()-0.5)*6;
  m.position.set(tree[0]+dx, 7+rnd()*3, tree[1]+dz);
  m.rotation.set(rnd()*3, rnd()*3, rnd()*3);
}

// ---------- animation ----------
const clock = new THREE.Clock();
let autoPause = 0;
renderer.domElement.addEventListener('pointerdown', ()=>{ controls.autoRotate = false; autoPause = 0; });
renderer.domElement.addEventListener('wheel', ()=>{ controls.autoRotate = false; autoPause = 0; });

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  controls.update();

  // auto-rotate resumes after a moment
  if(!controls.autoRotate){
    autoPause += dt;
    if(autoPause > 3) controls.autoRotate = true;
  }

  // clouds drift
  clouds.forEach((c,i)=>{
    c.position.x += dt * (0.4 + i*0.15);
    if(c.position.x > 34) c.position.x = -34;
  });

  // birds bob
  birds.forEach((b,i)=>{
    b.g.position.y = 15 + Math.sin(t*2 + b.phase)*0.7 + i*1.5;
    b.g.position.x += Math.sin(t*0.7 + b.phase)*0.004;
    const flap = Math.sin(t*8 + b.phase)*0.5;
    b.wingL.rotation.z = 0.3 + flap*0.4;
    b.wingR.rotation.z = -0.3 - flap*0.4;
  });

  // petals fall
  petals.forEach(p=>{
    p.t += dt * p.speed;
    p.m.position.y -= dt * 0.9;
    p.m.position.x += Math.sin(p.t*2 + p.sway)*0.03;
    p.m.rotation.x += dt*1.5; p.m.rotation.y += dt*1.2;
    if(p.m.position.y < 0.15) resetPetal(p.m, p.tree);
  });

  renderer.render(scene, camera);
}
animate();

// ---------- resize ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
